    <dialog class="bookLibrary" id="bookDialog" open>
        <form method="dialog" class="addBook-form">
            <div class="form-group">
                <label for="title">Title: </label>
                <input type="text" id="title" name="bookTitle" required autocomplete="on">
            </div>
            <div class="form-group">
                <label for="author">Author: </label>
                <input type="text" id="author" name="bookAuthor" autocomplete="on" >
            </div>
            <div class="form-group">
                <label for="totalPages">Total Pages: </label>
                <input type="number" id="totalPages" name="totalPages" min="1" step="1" autocomplete="on" >
            </div>
            <div class="form-group">
                <label for="publishYear">Year Published: </label>
                <input type="number" id="publishYear" name="publishYear" min="1" max="3000" autocomplete="on" >
            </div>
            <div class="form-group">
                <label for="read-status">Read Status</label>
                <select id="read-status" name="readStatus" required>
                    <!-- <option value="" selected disabled hidden>--Please read status of book--</option> -->
                    <option value="Not Read" selected>Not Read</option>
                    <option value="Read">Read</option>
                    <option value="Ongoing">Ongoing</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn_book-add">Add</button>
            </div>
        </form>
        <button type="button" class="btn close-btn">X</button>
    </dialog>
