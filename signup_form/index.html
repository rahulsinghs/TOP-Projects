<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign-in Form</title>
    <meta name="viewport" content="width=device-width, inital-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper">
        <section class="pic_sec">
            <div class="logo">
                <img src="img/odin-lined.png">
                <p>odin</p>
            </div>
            <figcaption class="credit">Photo by Halie West on Unsplash</figcaption>
        </section>
        <section class="content_sec">
            <div class="top-part">
                <p>
                    This is not a real online service! You know you need something
                    like this in your life to help you realize your deepest dreams.
                    <br>Sign up <span>now</span> to get started
                </p>
                <p>You <span>know</span> you want to.</p>
            </div>

            <div class="middle-part">
                <p>Let's do this!</p>
                <form action="#" method="get">
                    <label for="first_name">
                        <span>First Name</span> <input type="text" name="first_name" id="first_name">
                    </label>
                    <label for="last_name">
                        <span>Last Name</span> <input type="text" name="last_name" id="last_name">
                    </label>
                    <label for="email">
                        <span>Email</span> <input type="text" name="email" id="email">
                    </label>
                    <label for="phone_number">
                        <span>Phone Number</span> <input type="text" name="phone_number" id="phone_number">
                    </label>
                    <label for="password">
                        <span>Password</span> <input type="text" name="password" id="password" required>
                    </label>
                    <label for="confirm_password">
                        <span>Confirm Password</span> <input type="text" name="confirm_password" id="confirm_password" required>
                    </label>
                </form>
            </div>

            <div class="lower-part">
                <button class="btn btn-my">Create Account</button>
                <p>Alreay have an account? <a href="#">Log in</a></p>

            </div>

        </section>
    </div>
</body>

</html>
