<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Project: <span class="head_text">Calculator</span></h1>
    <div class="main_body">
        <!-- screen -->
        <div class="display_screen">
            <div class="previous"></div>
            <div class="current">0</div>
        </div>

        <!-- keypad -->
        <div class="keypad">
            <!-- numbers -->
            <div class="numbers">
                <button class="num num7">7</button>
                <button class="num num8">8</button>
                <button class="num num9">9</button>
                <button class="num num4">4</button>
                <button class="num num5">5</button>
                <button class="num num6">6</button>
                <button class="num num1">1</button>
                <button class="num num2">2</button>
                <button class="num num3">3</button>
                <button class="btn btn-del">del</button>
                <button class="num num0">0</button>
                <button class="btn btn-decimal">.</button>
            </div>

            <!-- operator area -->
            <div class="calculation_area">
                <div class="operators">
                    <button class="btn ops btn-add">+</button>
                    <button class="btn ops btn-subtract">-</button>
                    <button class="btn ops btn-percentage">%</button>
                    <button class="btn ops btn-multiply">*</button>
                    <button class="btn ops btn-division">/</button>
                </div>
                <button class="btn ac">AC</button>
                <button class="btn equalto">=</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
